name: Deploy art-portfolio-test-deployment to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      SITE_BASE_URL: https://dstawiszynski.github.io/art-portfolio-test-deployment/

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build art-portfolio-test-deployment
        run: npm run build:art-portfolio-test-deployment

      - name: Prevent Jekyll processing
        run: touch dist/art-portfolio-test-deployment/browser/.nojekyll

      - name: SPA fallback for unknown routes
        run: cp dist/art-portfolio-test-deployment/browser/index.csr.html dist/art-portfolio-test-deployment/browser/404.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/art-portfolio-test-deployment/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
